name = "the-interface-publisher"
main = "worker.js"
compatibility_date = "2026-08-29"

[triggers]
# Four attempts per UTC day. DAILY_ARTICLE_LIMIT prevents more than four publishes.
crons = ["0 3,9,15,21 * * *"]

[vars]
GITHUB_BRANCH = "main"
DAILY_ARTICLE_LIMIT = "4"
GROQ_MODEL = "openai/gpt-oss-120b"
